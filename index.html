<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#9ed2f0" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>عالم ثلاثي الأبعاد</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #9ed2f0;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }

  canvas { display: block; position: fixed; inset: 0; touch-action: none; }

  /* ============ الواجهة ============ */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .panel {
    background: rgba(10, 16, 26, 0.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #eaf2ff;
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.9;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.28);
  }

  /* ============ أزرار المنظور ============ */
  #modes {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: row;
    gap: 6px;
    padding: 6px;
    pointer-events: auto;
    white-space: nowrap;
    max-width: calc(100vw - 24px);
  }

  .mode-btn {
    pointer-events: auto;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.08);
    color: #dbe8ff;
    padding: 8px 12px;
    border-radius: 9px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
    transition: background .18s, box-shadow .18s, color .18s, transform .12s;
    touch-action: manipulation;
  }
  .mode-btn:active { transform: scale(0.94); }
  .mode-btn.active {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border-color: #7cb1ff;
    color: #fff;
    box-shadow: 0 0 18px rgba(59, 130, 246, 0.55);
  }

  /* ============ لوحة المساعدة (سطح المكتب) ============ */
  #help {
    position: absolute;
    bottom: calc(18px + env(safe-area-inset-bottom));
    right: calc(18px + env(safe-area-inset-right));
    min-width: 200px;
  }

  .k {
    display: inline-block;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    padding: 0 7px;
    font-size: 12px;
    font-weight: 700;
    margin-inline-end: 4px;
  }

  /* ============ مؤشر التصويب ============ */
  #crosshair {
    position: absolute;
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35);
    display: none;
  }

  /* ============ تلميح البداية ============ */
  #hint {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 15px;
    font-weight: 700;
    padding: 16px 26px;
    text-align: center;
    animation: pulse 2.2s ease-in-out infinite;
    max-width: 82vw;
  }

  @keyframes pulse {
    0%, 100% { opacity: .6; }
    50% { opacity: 1; }
  }

  /* ============================================================
     أدوات اللمس (تظهر على الأجهزة اللمسية فقط)
     ============================================================ */
  #touch-ui { display: none; }
  body.touch #touch-ui { display: block; }

  /* --- عصا التحكم --- */
  #joystick {
    position: absolute;
    left: calc(20px + env(safe-area-inset-left));
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.14), rgba(10,16,26,0.34));
    border: 2px solid rgba(255, 255, 255, 0.28);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    pointer-events: auto;
    touch-action: none;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.3), inset 0 0 24px rgba(255,255,255,0.07);
  }

  /* حلقات زخرفية داخل العصا */
  #joystick::before,
  #joystick::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.12);
    pointer-events: none;
  }
  #joystick::before { inset: 22%; }
  #joystick::after  { inset: 40%; }

  #knob {
    position: absolute;
    left: 50%; top: 50%;
    width: 58px;
    height: 58px;
    margin: -29px 0 0 -29px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #b9cbe6 55%, #7d93b5);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.42), inset 0 -3px 8px rgba(0,0,0,0.18);
    transition: transform .14s cubic-bezier(.2,.8,.3,1);
    pointer-events: none;
  }
  #knob.dragging { transition: none; }

  /* أيقونة صغيرة داخل المقبض */
  #knob::after {
    content: '';
    position: absolute;
    inset: 32%;
    border-radius: 50%;
    background: rgba(30, 50, 80, 0.28);
  }

  /* --- أزرار الإجراءات --- */
  #actions {
    position: absolute;
    right: calc(20px + env(safe-area-inset-right));
    bottom: calc(24px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }

  .act-btn {
    pointer-events: auto;
    touch-action: none;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.34);
    background: rgba(10, 16, 26, 0.42);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: #eaf2ff;
    font: inherit;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    line-height: 1.05;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
    transition: transform .1s, background .15s, box-shadow .15s;
    user-select: none;
  }
  .act-btn:active,
  .act-btn.pressed { transform: scale(0.9); }

  #btn-jump {
    width: 84px; height: 84px;
    font-size: 13px;
    background: rgba(59, 130, 246, 0.4);
    border-color: rgba(140, 190, 255, 0.6);
  }
  #btn-jump.pressed { background: rgba(59, 130, 246, 0.75); }

  #btn-run {
    width: 66px; height: 66px;
    font-size: 11.5px;
  }
  #btn-run.active {
    background: rgba(250, 176, 60, 0.6);
    border-color: rgba(255, 210, 130, 0.85);
    box-shadow: 0 0 20px rgba(250, 176, 60, 0.55);
  }

  .act-ico { font-size: 20px; margin-bottom: 1px; }
  #btn-run .act-ico { font-size: 16px; }

  /* --- لوحة مساعدة اللمس --- */
  #touch-help {
    position: absolute;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    font-size: 11.5px;
    line-height: 1.7;
    text-align: center;
    padding: 8px 14px;
    border-radius: 12px;
    opacity: .9;
    display: none;
  }
  body.touch #touch-help { display: block; }

  /* ============================================================
     تعديلات الشاشات الصغيرة
     ============================================================ */
  @media (max-width: 760px) {
    #help { display: none; }
  }

  @media (max-width: 460px) {
    .mode-btn { padding: 7px 9px; font-size: 11.5px; }
    #joystick { width: 118px; height: 118px; }
    #knob { width: 52px; height: 52px; margin: -26px 0 0 -26px; }
    #btn-jump { width: 74px; height: 74px; font-size: 12px; }
    #btn-run  { width: 58px; height: 58px; font-size: 10.5px; }
    #touch-help { display: none !important; }
  }

  /* شاشات أفقية منخفضة الارتفاع */
  @media (max-height: 430px) and (orientation: landscape) {
    #joystick { width: 104px; height: 104px; bottom: 14px; }
    #knob { width: 46px; height: 46px; margin: -23px 0 0 -23px; }
    #btn-jump { width: 64px; height: 64px; font-size: 11px; }
    #btn-run  { width: 52px; height: 52px; font-size: 10px; }
    #touch-help { display: none !important; }
    #modes { top: 8px; }
  }
</style>
</head>
<body>

<div id="hud">
  <div id="crosshair"></div>

  <!-- أزرار تغيير المنظور -->
  <div id="modes" class="panel">
    <button class="mode-btn active" data-mode="0">أول</button>
    <button class="mode-btn" data-mode="1">ثالث</button>
    <button class="mode-btn" data-mode="2">علوي</button>
  </div>

  <!-- لوحة المساعدة لسطح المكتب -->
  <div id="help" class="panel">
    <div><span class="k">W A S D</span> الحركة</div>
    <div><span class="k">الفأرة</span> النظر</div>
    <div><span class="k">مسافة</span> القفز</div>
    <div><span class="k">Shift</span> الجري</div>
    <div><span class="k">1 2 3</span> تغيير المنظور</div>
    <div><span class="k">Esc</span> تحرير المؤشر</div>
  </div>

  <!-- تلميح البداية -->
  <div id="hint" class="panel">انقر في أي مكان لبدء اللعب</div>

  <!-- ============ أدوات اللمس ============ -->
  <div id="touch-ui">
    <div id="joystick"><div id="knob"></div></div>

    <div id="actions">
      <button id="btn-run" class="act-btn" aria-label="الجري">
        <span class="act-ico">»</span>جري
      </button>
      <button id="btn-jump" class="act-btn" aria-label="القفز">
        <span class="act-ico">⤒</span>قفز
      </button>
    </div>

    <div id="touch-help" class="panel">
      اسحب بإصبعك للنظر · العصا للحركة
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   كشف الجهاز اللمسي
   ============================================================ */
const IS_TOUCH =
  ('ontouchstart' in window) ||
  (navigator.maxTouchPoints > 0) ||
  window.matchMedia('(hover: none) and (pointer: coarse)').matches;

if (IS_TOUCH) document.body.classList.add('touch');

// في حال كان الجهاز هجيناً: نُفعّل أدوات اللمس عند أول لمسة
window.addEventListener('touchstart', () => {
  if (!document.body.classList.contains('touch')) {
    document.body.classList.add('touch');
  }
}, { once: true, passive: true });

/* ============================================================
   الإعدادات الأساسية
   ============================================================ */
const SKY_COLOR   = 0x9ed2f0;
const WORLD_SIZE  = 400;
const BOUND       = 110;
const GRAVITY     = 24;
const JUMP_SPEED  = 8.2;
const WALK_SPEED  = 5.6;
const RUN_SPEED   = 11.0;
const EYE_HEIGHT  = 1.75;

const MOUSE_SENS = 0.0023;
const TOUCH_SENS = 0.0048;

const CAM_MODES = [
  { name: 'منظور أول',  dist: 0,    minPitch: -1.50, maxPitch: 1.50 },
  { name: 'منظور ثالث', dist: 5.8,  minPitch: -1.20, maxPitch: 1.50 },
  { name: 'منظور علوي', dist: 15.0, minPitch: -1.45, maxPitch: -0.55 }
];

/* ============================================================
   المُصيّر والمشهد
   ============================================================ */
const renderer = new THREE.WebGLRenderer({
  antialias: !IS_TOUCH,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_TOUCH ? 1.75 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = IS_TOUCH ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.style.touchAction = 'none';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY_COLOR);
scene.fog = new THREE.Fog(SKY_COLOR, 70, 200);

const camera = new THREE.PerspectiveCamera(
  IS_TOUCH ? 78 : 72,
  window.innerWidth / window.innerHeight,
  0.06,
  600
);
camera.rotation.order = 'YXZ';

/* ============================================================
   الإضاءة
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x4a6b33, 1.25));

const sun = new THREE.DirectionalLight(0xfff0d0, 2.1);
sun.position.set(35, 60, 25);
sun.castShadow = true;
const SHADOW_SIZE = IS_TOUCH ? 1024 : 2048;
sun.shadow.mapSize.set(SHADOW_SIZE, SHADOW_SIZE);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 220;
const SHADOW_AREA = 45;
sun.shadow.camera.left   = -SHADOW_AREA;
sun.shadow.camera.right  =  SHADOW_AREA;
sun.shadow.camera.top    =  SHADOW_AREA;
sun.shadow.camera.bottom = -SHADOW_AREA;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
scene.add(sun);
scene.add(sun.target);

/* ============================================================
   المواد المشتركة
   ============================================================ */
const MAT = {
  trunk:  new THREE.MeshLambertMaterial({ color: 0x6b4a2f }),
  leafA:  new THREE.MeshLambertMaterial({ color: 0x2e7d32 }),
  leafB:  new THREE.MeshLambertMaterial({ color: 0x41924b }),
  rock:   new THREE.MeshLambertMaterial({ color: 0x8b9099, flatShading: true }),
  bush:   new THREE.MeshLambertMaterial({ color: 0x357a38, flatShading: true })
};

const rand = (a, b) => a + Math.random() * (b - a);
const damp = (a, b, lambda, dt) => a + (b - a) * (1 - Math.exp(-lambda * dt));

/* ============================================================
   الأرضية المسطّحة
   ============================================================ */
function createGroundTexture() {
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');

  ctx.fillStyle = '#6aa84f';
  ctx.fillRect(0, 0, S, S);

  const h = S / 2;
  ctx.fillStyle = '#63a049';
  ctx.fillRect(0, 0, h, h);
  ctx.fillRect(h, h, h, h);

  for (let i = 0; i < 3500; i++) {
    const a = Math.random() * 0.14;
    ctx.fillStyle = Math.random() > 0.5
      ? `rgba(255,255,255,${a})`
      : `rgba(0,0,0,${a})`;
    ctx.fillRect(Math.random() * S, Math.random() * S, 2, 2);
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(60, 60);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE),
  new THREE.MeshLambertMaterial({ map: createGroundTexture() })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   الغيوم
   ============================================================ */
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: true });
const clouds = [];
const CLOUD_COUNT = IS_TOUCH ? 10 : 16;

for (let i = 0; i < CLOUD_COUNT; i++) {
  const cloud = new THREE.Group();
  const puffs = 3 + Math.floor(Math.random() * 4);
  for (let p = 0; p < puffs; p++) {
    const s = rand(3, 7);
    const puff = new THREE.Mesh(new THREE.SphereGeometry(s, 8, 6), cloudMat);
    puff.position.set(rand(-8, 8), rand(-1.5, 1.5), rand(-5, 5));
    puff.scale.y = 0.55;
    cloud.add(puff);
  }
  cloud.position.set(rand(-180, 180), rand(55, 85), rand(-180, 180));
  scene.add(cloud);
  clouds.push(cloud);
}

/* ============================================================
   الأشجار والصخور والشجيرات
   ============================================================ */
const obstacles = [];

function createTree() {
  const g = new THREE.Group();
  const trunkH = rand(1.4, 2.2);

  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.26, trunkH, 7), MAT.trunk);
  trunk.position.y = trunkH / 2;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  g.add(trunk);

  const layers = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < layers; i++) {
    const r = 1.65 - i * 0.42;
    const hgt = 1.8 - i * 0.25;
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(r, hgt, 8),
      i % 2 ? MAT.leafA : MAT.leafB
    );
    cone.position.y = trunkH + i * 0.92 - 0.25;
    cone.castShadow = true;
    cone.receiveShadow = true;
    g.add(cone);
  }
  return g;
}

function createRock() {
  const s = rand(0.5, 1.7);
  const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), MAT.rock);
  rock.position.y = s * 0.42;
  rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  rock.scale.y = rand(0.55, 0.9);
  rock.castShadow = true;
  rock.receiveShadow = true;
  return rock;
}

function createBush() {
  const g = new THREE.Group();
  const n = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const s = rand(0.4, 0.75);
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), MAT.bush);
    b.position.set(rand(-0.4, 0.4), s * 0.75, rand(-0.4, 0.4));
    b.castShadow = true;
    b.receiveShadow = true;
    g.add(b);
  }
  return g;
}

const worldGroup = new THREE.Group();
scene.add(worldGroup);

function scatter(count, factory, minDist, maxDist, radius, scaleRange) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const d = rand(minDist, maxDist);
    const x = Math.cos(ang) * d;
    const z = Math.sin(ang) * d;

    const obj = factory();
    obj.position.x = x;
    obj.position.z = z;
    obj.rotation.y = Math.random() * Math.PI * 2;

    const sc = rand(scaleRange[0], scaleRange[1]);
    obj.scale.setScalar(sc);

    worldGroup.add(obj);
    obstacles.push({ x, z, r: radius * sc });
  }
}

const DENSITY = IS_TOUCH ? 0.68 : 1;
scatter(Math.round(95 * DENSITY), createTree,  9, 108, 0.65, [0.85, 1.45]);
scatter(Math.round(60 * DENSITY), createRock,  6, 110, 0.9,  [0.7, 1.5]);
scatter(Math.round(55 * DENSITY), createBush,  5, 110, 0.6,  [0.8, 1.4]);

/* ============================================================
   اللاعب
   ============================================================ */
const P_MAT = {
  skin:  new THREE.MeshLambertMaterial({ color: 0xf2c9a0 }),
  shirt: new THREE.MeshLambertMaterial({ color: 0x2f6fed }),
  pants: new THREE.MeshLambertMaterial({ color: 0x27354f }),
  shoe:  new THREE.MeshLambertMaterial({ color: 0x1c1f26 }),
  hair:  new THREE.MeshLambertMaterial({ color: 0x2a1e17 })
};

function makeLimb(w, h, d, mat, pivotY, offsetX, isLeg) {
  const pivot = new THREE.Group();
  pivot.position.set(offsetX, pivotY, 0);

  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.y = -h / 2;
  mesh.castShadow = true;
  pivot.add(mesh);

  if (isLeg) {
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(w + 0.07, 0.15, d + 0.2), P_MAT.shoe);
    shoe.position.set(0, -h + 0.075, -0.05);
    shoe.castShadow = true;
    pivot.add(shoe);
  }
  return pivot;
}

function createPlayer() {
  const root = new THREE.Group();

  const legL = makeLimb(0.22, 0.85, 0.24, P_MAT.pants, 0.85, -0.16, true);
  const legR = makeLimb(0.22, 0.85, 0.24, P_MAT.pants, 0.85,  0.16, true);
  root.add(legL, legR);

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.70, 0.34), P_MAT.shirt);
  torso.position.y = 1.20;
  torso.castShadow = true;
  root.add(torso);

  const armL = makeLimb(0.17, 0.68, 0.19, P_MAT.shirt, 1.50, -0.395, false);
  const armR = makeLimb(0.17, 0.68, 0.19, P_MAT.shirt, 1.50,  0.395, false);
  root.add(armL, armR);

  const headGroup = new THREE.Group();
  headGroup.position.y = 1.77;

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.225, 20, 16), P_MAT.skin);
  head.castShadow = true;
  headGroup.add(head);

  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.235, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.62),
    P_MAT.hair
  );
  hair.position.y = 0.015;
  hair.castShadow = true;
  headGroup.add(hair);

  const eyeGeo = new THREE.SphereGeometry(0.033, 10, 8);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.085, 0.03, -0.20);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(0.085, 0.03, -0.20);
  headGroup.add(eyeL, eyeR);

  root.add(headGroup);

  return { root, headGroup, legL, legR, armL, armR };
}

const playerObj = createPlayer();
const player = playerObj.root;
player.position.set(0, 0, 0);
scene.add(player);

/* ============================================================
   حالة اللعبة
   ============================================================ */
let yaw = 0;
let pitch = -0.18;
let camMode = 0;
let camDist = CAM_MODES[1].dist;

const velocity = new THREE.Vector3(0, 0, 0);
const moveDir = new THREE.Vector3();
const fwdH = new THREE.Vector3();
const rightH = new THREE.Vector3();
const camForward = new THREE.Vector3();
const camTarget = new THREE.Vector3();

let verticalVel = 0;
let onGround = true;
let walkPhase = 0;
let pointerLocked = false;
let dragging = false;

const keys = Object.create(null);

/* ============================================================
   مدخلات لوحة المفاتيح
   ============================================================ */
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;

  if (e.code === 'Space') e.preventDefault();

  if (e.code === 'Digit1' || e.code === 'Numpad1') setMode(0);
  if (e.code === 'Digit2' || e.code === 'Numpad2') setMode(1);
  if (e.code === 'Digit3' || e.code === 'Numpad3') setMode(2);
  if (e.code === 'KeyC') setMode((camMode + 1) % CAM_MODES.length);
});

window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ============================================================
   مدخلات اللمس — عصا التحكم
   ============================================================ */
const joystickEl = document.getElementById('joystick');
const knobEl     = document.getElementById('knob');

let joyId = null;
let joyX = 0;   // -1 .. 1  (يمين)
let joyY = 0;   // -1 .. 1  (أسفل)

function applyJoystick(clientX, clientY) {
  const rect = joystickEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  let dx = clientX - cx;
  let dy = clientY - cy;

  const maxR = rect.width / 2 - 8;
  const d = Math.hypot(dx, dy);

  if (d > maxR) {
    dx = (dx / d) * maxR;
    dy = (dy / d) * maxR;
  }

  joyX = dx / maxR;
  joyY = dy / maxR;

  knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
}

function resetJoystick() {
  joyId = null;
  joyX = 0;
  joyY = 0;
  knobEl.classList.remove('dragging');
  knobEl.style.transform = 'translate(0px, 0px)';
}

joystickEl.addEventListener('pointerdown', (e) => {
  if (joyId !== null) return;
  joyId = e.pointerId;
  knobEl.classList.add('dragging');
  try { joystickEl.setPointerCapture(e.pointerId); } catch (_) {}
  applyJoystick(e.clientX, e.clientY);
  hideHint();
  e.preventDefault();
});

joystickEl.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyId) return;
  applyJoystick(e.clientX, e.clientY);
  e.preventDefault();
});

['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => {
  joystickEl.addEventListener(ev, (e) => {
    if (e.pointerId !== joyId) return;
    resetJoystick();
  });
});

/* ============================================================
   مدخلات اللمس — النظر بالسحب
   ============================================================ */
let lookId = null;
let lastLookX = 0;
let lastLookY = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') {
    if (lookId !== null) return;
    lookId = e.pointerId;
    lastLookX = e.clientX;
    lastLookY = e.clientY;
    try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) {}
    hideHint();
    e.preventDefault();
  } else {
    // سطح المكتب: قفل المؤشر
    if (!pointerLocked) {
      const p = renderer.domElement.requestPointerLock();
      if (p && p.catch) p.catch(() => {});
    }
    dragging = true;
  }
});

document.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') {
    if (e.pointerId !== lookId) return;

    const dx = e.clientX - lastLookX;
    const dy = e.clientY - lastLookY;
    lastLookX = e.clientX;
    lastLookY = e.clientY;

    yaw   -= dx * TOUCH_SENS;
    pitch -= dy * TOUCH_SENS;
    clampPitch();
    e.preventDefault();

  } else if (pointerLocked || dragging) {
    yaw   -= e.movementX * MOUSE_SENS;
    pitch -= e.movementY * MOUSE_SENS;
    clampPitch();
  }
}, { passive: false });

['pointerup', 'pointercancel'].forEach((ev) => {
  document.addEventListener(ev, (e) => {
    if (e.pointerType === 'touch' && e.pointerId === lookId) lookId = null;
    if (e.pointerType !== 'touch') dragging = false;
  });
});

window.addEventListener('mouseup', () => { dragging = false; });

/* ============================================================
   مدخلات اللمس — أزرار الإجراءات
   ============================================================ */
const btnJump = document.getElementById('btn-jump');
const btnRun  = document.getElementById('btn-run');

let touchJump = false;
let touchRun  = false;

btnJump.addEventListener('pointerdown', (e) => {
  touchJump = true;
  btnJump.classList.add('pressed');
  hideHint();
  if (navigator.vibrate) navigator.vibrate(12);
  e.preventDefault();
});

['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => {
  btnJump.addEventListener(ev, () => {
    touchJump = false;
    btnJump.classList.remove('pressed');
  });
});

btnRun.addEventListener('pointerdown', (e) => {
  touchRun = !touchRun;
  btnRun.classList.toggle('active', touchRun);
  hideHint();
  if (navigator.vibrate) navigator.vibrate(10);
  e.preventDefault();
});

/* ============================================================
   قفل المؤشر (سطح المكتب)
   ============================================================ */
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
  if (!IS_TOUCH) {
    document.getElementById('hint').style.display = pointerLocked ? 'none' : 'block';
  }
});

/* ============================================================
   عجلة الفأرة لتغيير المنظور
   ============================================================ */
window.addEventListener('wheel', (e) => {
  if (IS_TOUCH) return;
  if (Math.abs(e.deltaY) < 4) return;
  const dir = e.deltaY > 0 ? 1 : -1;
  setMode((camMode + dir + CAM_MODES.length) % CAM_MODES.length);
}, { passive: true });

/* ============================================================
   أزرار المنظور
   ============================================================ */
document.querySelectorAll('.mode-btn').forEach((btn) => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    setMode(parseInt(btn.dataset.mode, 10));
    hideHint();
  });
});

function setMode(mode) {
  if (mode === camMode) return;
  camMode = mode;

  const m = CAM_MODES[mode];
  if (mode === 2) pitch = -1.05;
  clampPitch();

  document.querySelectorAll('.mode-btn').forEach((b) => {
    b.classList.toggle('active', parseInt(b.dataset.mode, 10) === mode);
  });

  document.getElementById('crosshair').style.display = mode === 0 ? 'block' : 'none';
}

function clampPitch() {
  const m = CAM_MODES[camMode];
  pitch = Math.max(m.minPitch, Math.min(m.maxPitch, pitch));
}

/* ============================================================
   إخفاء التلميح
   ============================================================ */
let hintHidden = false;
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  const h = document.getElementById('hint');
  h.style.transition = 'opacity .45s ease';
  h.style.opacity = '0';
  setTimeout(() => { h.style.display = 'none'; }, 500);
}

// على الأجهزة اللمسية: لا حاجة لقفل المؤشر
if (IS_TOUCH) {
  document.getElementById('hint').textContent = 'المس الشاشة وابدأ الاستكشاف';
}

/* ============================================================
   حلقة اللعبة
   ============================================================ */
const clock = new THREE.Clock();

function update(dt) {
  /* ---------- اتجاهات الكاميرا ---------- */
  fwdH.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  rightH.set(Math.cos(yaw), 0, -Math.sin(yaw));

  /* ---------- جمع المدخلات ---------- */
  let ix = 0, iz = 0;

  if (keys.KeyW || keys.ArrowUp)    iz += 1;
  if (keys.KeyS || keys.ArrowDown)  iz -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyA || keys.ArrowLeft)  ix -= 1;

  // عصا التحكم (تناظرية)
  const JOY_DEAD = 0.14;
  if (Math.abs(joyX) > JOY_DEAD || Math.abs(joyY) > JOY_DEAD) {
    ix += joyX;
    iz += -joyY;   // أعلى الشاشة = للأمام
  }

  /* ---------- اتجاه الحركة ---------- */
  moveDir.set(0, 0, 0);
  const mag = Math.hypot(ix, iz);

  if (mag > 0.001) {
    const scale = Math.min(mag, 1) / mag;
    moveDir
      .addScaledVector(fwdH, iz * scale)
      .addScaledVector(rightH, ix * scale);
  }

  const running = !!(keys.ShiftLeft || keys.ShiftRight || touchRun);
  const speed = running ? RUN_SPEED : WALK_SPEED;

  /* ---------- السرعة مع تنعيم ---------- */
  velocity.x = damp(velocity.x, moveDir.x * speed, 14, dt);
  velocity.z = damp(velocity.z, moveDir.z * speed, 14, dt);

  player.position.x += velocity.x * dt;
  player.position.z += velocity.z * dt;

  /* ---------- القفز والجاذبية ---------- */
  if ((keys.Space || touchJump) && onGround) {
    verticalVel = JUMP_SPEED;
    onGround = false;
    touchJump = false;
  }

  verticalVel -= GRAVITY * dt;
  player.position.y += verticalVel * dt;

  if (player.position.y <= 0) {
    player.position.y = 0;
    verticalVel = 0;
    onGround = true;
  }

  /* ---------- التصادم مع العوائق ---------- */
  const PR = 0.42;
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    const dx = player.position.x - o.x;
    const dz = player.position.z - o.z;
    const minD = o.r + PR;
    const d2 = dx * dx + dz * dz;

    if (d2 < minD * minD && d2 > 0.0001) {
      const d = Math.sqrt(d2);
      player.position.x = o.x + (dx / d) * minD;
      player.position.z = o.z + (dz / d) * minD;
    }
  }

  /* ---------- حدود العالم ---------- */
  player.position.x = Math.max(-BOUND, Math.min(BOUND, player.position.x));
  player.position.z = Math.max(-BOUND, Math.min(BOUND, player.position.z));

  /* ---------- دوران اللاعب ---------- */
  const planarSpeed = Math.hypot(velocity.x, velocity.z);

  if (planarSpeed > 0.35) {
    const targetYaw = Math.atan2(-velocity.x, -velocity.z);
    let diff = targetYaw - player.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.rotation.y += diff * (1 - Math.exp(-16 * dt));
  }

  /* ---------- تحريك الأطراف ---------- */
  if (planarSpeed > 0.35 && onGround) {
    walkPhase += dt * (running ? 13 : 9.5);
    const amp = Math.min(planarSpeed / RUN_SPEED, 1) * 0.85;

    playerObj.legL.rotation.x =  Math.sin(walkPhase) * amp;
    playerObj.legR.rotation.x = -Math.sin(walkPhase) * amp;
    playerObj.armL.rotation.x = -Math.sin(walkPhase) * amp * 0.8;
    playerObj.armR.rotation.x =  Math.sin(walkPhase) * amp * 0.8;
  } else {
    playerObj.legL.rotation.x = damp(playerObj.legL.rotation.x, 0, 10, dt);
    playerObj.legR.rotation.x = damp(playerObj.legR.rotation.x, 0, 10, dt);
    playerObj.armL.rotation.x = damp(playerObj.armL.rotation.x, 0, 10, dt);
    playerObj.armR.rotation.x = damp(playerObj.armR.rotation.x, 0, 10, dt);
    walkPhase = 0;
  }

  // وضعية القفز
  if (!onGround) {
    const t = Math.max(-0.7, Math.min(0.7, -verticalVel * 0.06));
    playerObj.legL.rotation.x = damp(playerObj.legL.rotation.x,  0.35 + t, 10, dt);
    playerObj.legR.rotation.x = damp(playerObj.legR.rotation.x, -0.25 + t, 10, dt);
    playerObj.armL.rotation.x = damp(playerObj.armL.rotation.x, -0.9, 10, dt);
    playerObj.armR.rotation.x = damp(playerObj.armR.rotation.x, -0.9, 10, dt);
  }

  // الرأس يتبع النظر في المنظور الأول
  playerObj.headGroup.rotation.x = camMode === 0 ? 0 : pitch * 0.35;

  /* ---------- الكاميرا ---------- */
  camForward.set(
    -Math.sin(yaw) * Math.cos(pitch),
     Math.sin(pitch),
    -Math.cos(yaw) * Math.cos(pitch)
  );

  if (camMode === 0) {
    playerObj.headGroup.visible = false;

    camera.position.set(
      player.position.x,
      player.position.y + EYE_HEIGHT,
      player.position.z
    );
    camera.rotation.set(pitch, yaw, 0);

  } else {
    playerObj.headGroup.visible = true;

    const mode = CAM_MODES[camMode];
    camDist = damp(camDist, mode.dist, 10, dt);

    camTarget.set(
      player.position.x,
      player.position.y + 1.25,
      player.position.z
    );

    camera.position.copy(camTarget).addScaledVector(camForward, -camDist);

    if (camera.position.y < 0.6) camera.position.y = 0.6;

    camera.lookAt(camTarget);
  }

  /* ---------- الشمس تتبع اللاعب ---------- */
  sun.position.set(player.position.x + 35, 60, player.position.z + 25);
  sun.target.position.set(player.position.x, 0, player.position.z);
  sun.target.updateMatrixWorld();

  /* ---------- حركة الغيوم ---------- */
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    c.position.x += dt * (0.6 + (i % 5) * 0.25);
    if (c.position.x > 200) c.position.x = -200;
  }
}

/* ============================================================
   التشغيل
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);

  renderer.render(scene, camera);
}

/* ============================================================
   الاستجابة لتغيّر حجم الشاشة / الاتجاه
   ============================================================ */
let resizeTimer = null;
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  camera.aspect = w / h;
  camera.fov = (w < h && w < 520) ? 84 : (IS_TOUCH ? 78 : 72);
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_TOUCH ? 1.75 : 2));
  renderer.setSize(w, h);
}

window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(onResize, 90);
});

window.addEventListener('orientationchange', () => {
  setTimeout(onResize, 260);
});

// منع تكبير الصفحة باللمس المزدوج
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

/* ============================================================
   إعداد أولي
   ============================================================ */
setMode(0);
document.getElementById('crosshair').style.display = 'block';
onResize();
animate();
</script>
</body>
</html>
